<meta name="description" content="ARSENIC: Minecraft hosting, Discord bot development, web hosting and VPS. BUILD. HOST. CREATE.">
<meta property="og:title" content="ARSENIC — BUILD. HOST. CREATE.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7fd;--card:rgba(255,255,255,.78);--bd:rgba(30,30,80,.12);--tx:#15152e;--mu:#5a6083;--p:#7c3aed;--b:#2563eb;color-scheme:light}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(124,58,237,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.08) 1px,transparent 1px);background-size:48px 48px;animation:grid 12s linear infinite;mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 75%)}
@keyframes grid{to{background-position:48px 48px}}
.orb{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(120px);opacity:.16;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.o1{background:var(--p);top:-120px;left:-100px}.o2{background:var(--b);top:30%;right:-160px;animation-delay:-6s}
@keyframes fl{to{transform:translate(30px,40px)}}
a{color:inherit;text-decoration:none}a[data-go],a[data-soc]{cursor:pointer}.w{max-width:1160px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(255,255,255,.8);border-bottom:1px solid var(--bd)}
.nv{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;letter-spacing:.18em;font-size:1.15rem;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:6px;font-size:.88rem}.links a{padding:8px 11px;border-radius:10px;color:var(--mu);transition:.25s}
.links a:hover{color:var(--tx);background:rgba(124,58,237,.08)}.links a.on{color:var(--p);background:rgba(124,58,237,.14)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 .9rem inherit;cursor:pointer;transition:transform .2s,box-shadow .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);border-color:var(--p)}.btn:active{transform:scale(.94)}
.pri .rp{background:rgba(255,255,255,.5)}.pri{color:#fff;background:linear-gradient(135deg,var(--p),var(--b));border:0;box-shadow:0 0 24px rgba(124,58,237,.45)}.pri:hover{box-shadow:0 0 38px rgba(59,130,246,.65)}
.rp{position:absolute;border-radius:50%;background:rgba(124,58,237,.25);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
#burger{display:none;background:none;border:0;width:40px;height:40px;cursor:pointer}#burger i{display:block;height:2px;background:var(--tx);margin:6px 8px;transition:.3s}
#burger.on i:nth-child(1){transform:translateY(8px) rotate(45deg)}#burger.on i:nth-child(2){opacity:0}#burger.on i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
#mob{display:none;flex-direction:column;padding:6px 20px 16px;border-top:1px solid var(--bd)}#mob.on{display:flex;animation:in .3s}#mob a{padding:12px 0;color:var(--mu)}#mob a.on{color:var(--p)}
@media(max-width:1000px){.links,.hide{display:none}#burger{display:block}}
.page{display:none;padding:56px 0 40px}.page.on{display:block;animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.page.on .grid>*,.page.on .stagger>*{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.grid>*:nth-child(2){animation-delay:.07s!important}.grid>*:nth-child(3){animation-delay:.14s!important}.grid>*:nth-child(4){animation-delay:.21s!important}.grid>*:nth-child(5){animation-delay:.28s!important}.grid>*:nth-child(n+6){animation-delay:.35s!important}
.badge{display:inline-block;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:.72rem;letter-spacing:.08em;color:#7c3aed}
h1{font-size:clamp(2.6rem,8vw,5.2rem);line-height:1;font-weight:900;margin:20px 0 14px;background:linear-gradient(90deg,#15152e,#7c3aed 55%,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.8rem,4.5vw,2.7rem);font-weight:800;margin-bottom:8px}.sub{font-size:1.2rem;font-weight:600;margin-bottom:12px}.mu{color:var(--mu)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:68vh}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.vis{position:relative;height:380px}.vis svg{position:absolute;inset:0;width:100%;height:100%}
.vis path{stroke:url(#g);stroke-width:1.5;fill:none;stroke-dasharray:6 8;animation:dash 2s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}
.node{position:absolute;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px);font-size:.78rem;text-align:center;animation:fl 5s ease-in-out infinite alternate;box-shadow:0 0 30px rgba(124,58,237,.25)}
.node img{width:74px;height:54px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
@media(max-width:900px){.hero{grid-template-columns:1fr;min-height:auto}.vis{height:290px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.st{text-align:center;padding:22px 8px}.st b{font-size:2.1rem;font-weight:900;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(10px);transition:transform .3s,border-color .3s,box-shadow .3s;overflow:hidden}
.glass:hover{transform:translateY(-6px);border-color:rgba(124,58,237,.55);box-shadow:0 12px 36px rgba(124,58,237,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:28px}
.card .im{height:150px;background:linear-gradient(135deg,#ede9fe,#dbeafe);overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover .im img{transform:scale(1.08)}
.card .bd{padding:20px}.card h3{margin:4px 0 6px}.card p{color:var(--mu);font-size:.92rem;margin-bottom:14px}
.price{font-size:2rem;font-weight:900}.price small{font-size:.9rem;color:var(--mu);font-weight:400}
ul.f{list-style:none;padding:0;margin:14px 0 20px;display:grid;gap:8px;font-size:.9rem;color:var(--mu)}ul.f li:before{content:"✓ ";color:var(--b)}
.hl{border-color:var(--p);box-shadow:0 0 40px rgba(168,85,247,.35)}.tag{font-size:.7rem;color:#7c3aed;text-transform:uppercase;letter-spacing:.1em}.ok{color:#16a34a;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.tabs .btn.on{background:var(--p);border-color:var(--p);color:#fff}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:24px}.tl div{padding:18px}.tl b{font-size:1.6rem;color:var(--p)}
details{padding:16px 20px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{margin-top:10px;color:var(--mu)}
.pad{padding:24px}
footer{border-top:1px solid var(--bd);padding:44px 0 32px}.fl{display:flex;flex-wrap:wrap;gap:8px 20px;margin:16px 0;color:var(--mu);font-size:.9rem}.fl a:hover{color:var(--p)}
#ov{position:fixed;inset:0;z-index:100;background:rgba(21,21,46,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex;animation:fade .25s}@keyframes fade{from{opacity:0}}
#md{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--p);border-radius:22px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 0 60px rgba(124,58,237,.4)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
#md .im{height:170px}#md .bd{padding:22px}.x{position:absolute;right:12px;top:12px}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
.term{padding:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;border-color:rgba(168,85,247,.5);box-shadow:0 0 50px rgba(124,58,237,.3);animation:fl 6s ease-in-out infinite alternate}
.term .bar{display:flex;gap:7px;padding:12px 14px;border-bottom:1px solid var(--bd)}.term .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .ln{padding:18px 18px 22px;display:grid;gap:8px}.term .ln div{opacity:0;animation:in .5s forwards}.term .ln div:nth-child(1){animation-delay:.3s}.term .ln div:nth-child(2){animation-delay:.9s}.term .ln div:nth-child(3){animation-delay:1.4s}.term .ln div:nth-child(4){animation-delay:1.9s}.term .ln div:nth-child(5){animation-delay:2.4s}
.cur{display:inline-block;width:8px;height:15px;background:var(--b);vertical-align:middle;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.g{color:#16a34a}.pp{color:#7c3aed}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips span{font-size:.72rem;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:#7c3aed}
.pf{--b:#2b50ff;--p:#2b50ff}
.pf h1,.pf h2{font-family:"Playfair Display",Georgia,serif;color:#101a3d;-webkit-text-fill-color:#101a3d;background:none}
.pf h1 em{font-style:normal;-webkit-text-fill-color:#8d9bd0}.pf h2{text-align:center}
.pf .pri{background:#2b50ff;box-shadow:0 8px 22px rgba(43,80,255,.3)}.pf .pri:hover{box-shadow:0 12px 28px rgba(43,80,255,.45)}
.lbl{font-size:.72rem;letter-spacing:.14em;color:#2b50ff;font-weight:700;text-transform:uppercase}
.phero{background:#eef3ff;border-radius:28px;padding:56px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;overflow:hidden}
.av{width:min(300px,100%);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#dbe5ff,#bccaff);display:grid;place-items:center;font:700 6rem "Playfair Display",Georgia,serif;color:#2b50ff;margin:auto;overflow:hidden;box-shadow:0 20px 50px rgba(43,80,255,.2)}.av img{width:100%;height:100%;object-fit:cover}
.intro{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:center;margin:56px 0}.intro .av{width:min(240px,100%)}
.scard,.pcard{background:#fff;border:1px solid #e6ebfa;border-radius:16px;box-shadow:0 6px 24px rgba(43,80,255,.07);transition:transform .3s,box-shadow .3s}
.scard{padding:24px}.pcard{padding:12px}.scard:hover,.pcard:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(43,80,255,.16)}
.scard h3{font-family:"Playfair Display",Georgia,serif;margin-bottom:6px}.scard p{color:var(--mu);font-size:.9rem}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
.pim{height:170px;border-radius:12px;background:#eaeeff;overflow:hidden}.pim img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.pcard:hover .pim img{transform:scale(1.08)}
.pcard .t{margin:14px 6px 2px;font-size:.72rem;color:#2b50ff;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.pcard h3{margin:0 6px 8px;font-size:1.05rem}.pcard .chips{margin:0 6px 8px}
.pcenter{text-align:center;margin:64px 0 6px}
@media(max-width:900px){.phero,.intro{grid-template-columns:1fr;padding:30px 22px}.intro{padding:0}.phero .av{order:-1;width:200px}}
.logo{display:inline-flex;align-items:center;gap:10px;-webkit-background-clip:border-box;background:none;color:inherit}.logo span{background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}.lg{width:38px;height:38px;border-radius:50%;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.quote{margin:64px auto 0;max-width:720px;text-align:center;padding:34px 28px;background:#eef3ff;border-radius:22px;border-left:5px solid #2b50ff}.quote p{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.5rem,4vw,2.3rem);font-style:italic;color:#101a3d;line-height:1.25}.quote span{display:block;margin-top:12px;color:#2b50ff;font-weight:600;font-size:.9rem;letter-spacing:.06em}
.quote.nerd{text-align:left;border-left:5px solid #2b50ff;background:#0f1530;box-shadow:0 14px 40px rgba(43,80,255,.25)}.quote.nerd p{font-family:ui-monospace,Menlo,Consolas,monospace;font-style:normal;font-size:clamp(1.05rem,3.4vw,1.5rem);color:#dbe5ff;line-height:1.7}.quote.nerd b{color:#c084fc}.quote.nerd i{color:#7dd3fc;font-style:normal}.quote.nerd em{color:#4ade80;font-style:normal}.quote.nerd span{font-family:ui-monospace,Menlo,Consolas,monospace;color:#8d9bd0;font-weight:400}.quote.nerd .cur{display:inline-block;margin:0 0 0 6px;width:9px;height:18px;background:#7dd3fc}
.payb{display:grid;gap:6px}.payb input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit}.payb input:focus{outline:2px solid #2b50ff;border-color:transparent}
</style></head><body>

/* ===== Razorpay Standard Checkout (server: /api/create-order, /api/verify-payment) ===== */
function loadRzp(){return new Promise((ok,no)=>{if(window.Razorpay)return ok();const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=ok;s.onerror=()=>no(new Error("Could not load Razorpay. Check your connection."));document.head.appendChild(s)})}
async function payNow(item){const st=$("#rz-st"),pb=$("#rz-pay"),say=(t,ok)=>{st.textContent=t;st.style.color=ok?"#16a34a":"#dc2626"};
const dc=$("#rz-dc").value.trim(),em=$("#rz-em").value.trim();
if(dc.length<2)return say("Please enter your Discord username.");
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return say("Please enter a valid email.");
pb.disabled=true;say("Starting secure payment…",true);
try{await loadRzp();
const r=await fetch("/api/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item,discord:dc,email:em})});
const o=await r.json().catch(()=>({}));if(!r.ok)throw new Error(o.error||"Could not start payment");
const rz=new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency,order_id:o.order_id,name:"ARSENIC",description:item,prefill:{email:em},notes:{discord:dc},theme:{color:"#2b50ff"},
handler:async res=>{say("Verifying payment…",true);try{const v=await fetch("/api/verify-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({razorpay_order_id:res.razorpay_order_id,razorpay_payment_id:res.razorpay_payment_id,razorpay_signature:res.razorpay_signature})});const j=await v.json().catch(()=>({}));if(!v.ok||!j.success)throw new Error(j.error||"Verification failed");say("✔ Payment successful! ID: "+res.razorpay_payment_id+". We'll contact you on Discord.",true)}catch(e){say(e.message+". Contact us with payment ID "+res.razorpay_payment_id)}pb.disabled=false},
modal:{ondismiss:()=>{say("Payment cancelled.");pb.disabled=false}}});
rz.on("payment.failed",x=>{say("Payment failed: "+((x.error&&x.error.description)||"please try again."));pb.disabled=false});
rz.open()}catch(e){say(e.message||"Something went wrong.");pb.disabled=false}}

/* Router: pages open in place, no URL change */
let cur="home";
function go(p){closeM();cur=PAGES.includes(p)?p:"home";route()}
function route(){let p=PAGES.includes(cur)?cur:"home";
$("#app").innerHTML=`<section class="page on" aria-live="polite">${V[p]()}</section>`;document.title="ARSENIC — "+p[0].toUpperCase()+p.slice(1);
document.querySelectorAll("[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p==p||(p!="home"&&NAV.includes("store")&&a.dataset.p=="store"&&CATS.some(c=>c[0].toLowerCase()==p))));scrollTo({top:0});$("#mob").classList.remove("on");$("#burger").classList.remove("on");
const n=$("[data-n]");if(n){const T=+n.dataset.n;let t0;const f=t=>{t0=t0||t;const k=Math.min((t-t0)/1400,1);n.textContent=(T*k).toFixed(1)+"%";k<1&&requestAnimationFrame(f)};requestAnimationFrame(f)}}
const nav=NAV.map(p=>`<a data-go="${p}" data-p="${p}">${p[0].toUpperCase()+p.slice(1)}</a>`).join("");
$("#links").innerHTML=nav;$("#mob").innerHTML=nav+'<a class="btn pri" data-go="hosting" style="margin-top:8px">Get Started</a>';
$("#fl").innerHTML=["services","hosting","store","development","about","faq","contact"].map(p=>`<a data-go="${p}">${p[0].toUpperCase()+p.slice(1)}</a>`).join("")+'<a data-go="terms">Terms</a><a data-go="privacy">Privacy</a><a data-go="refund">Refund Policy</a>';
document.querySelectorAll("[data-soc]").forEach(a=>{const u=CONFIG.social[a.dataset.soc];if(u&&u!="#"){a.href=u;a.target="_blank";a.rel="noopener"}});
route();
/* Click handling + ripple animation */
document.addEventListener("click",e=>{const lk=e.target.closest("[data-go]");if(lk){e.preventDefault();go(lk.dataset.go)}const b=e.target.closest(".btn");if(b){const r=b.getBoundingClientRect(),s=document.createElement("span"),d=Math.max(r.width,r.height);s.className="rp";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}
const sc=e.target.closest("[data-scroll]");if(sc){const el=document.getElementById(sc.dataset.scroll);el&&el.scrollIntoView({behavior:"smooth"});return}
const t=e.target.closest("[data-enq],[data-enqp],[data-view],[data-cat],[data-close],[data-pay]");
if(e.target.id=="ov"||(t&&t.hasAttribute("data-close")))return closeM();if(!t)return;
if(t.dataset.enq!=null){const p=PRODUCTS[t.dataset.enq];enquire(p.name,p.price)}
else if(t.dataset.enqp){const[n,pr]=t.dataset.enqp.split("|");enquire(n,+pr)}
else if(t.dataset.pay)payNow(t.dataset.pay);
else if(t.dataset.view!=null)viewProduct(t.dataset.view);
});
$("#burger").onclick=function(){const o=$("#mob").classList.toggle("on");this.classList.toggle("on",o);this.setAttribute("aria-expanded",o)};
addEventListener("keydown",e=>e.key=="Escape"&&closeM());
